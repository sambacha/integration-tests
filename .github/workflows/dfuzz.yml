name: Build with dfuzz

on:
  push:
    branches: [main, dfuzz]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Setup dfuzz
        uses: ./.github/actions/setup-dfuzz
      
      - name: Setup build environment
        run: |
          # Use clang for fuzzer sanitizer support
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update && sudo apt-get install -y clang-15 clang++-15 lld-15
            echo "CC=clang-15" >> $GITHUB_ENV
            echo "CXX=clang++-15" >> $GITHUB_ENV
            sudo update-alternatives --install /usr/bin/lld lld /usr/bin/lld-15 100
          else
            # macOS - use system clang
            echo "CC=clang" >> $GITHUB_ENV
            echo "CXX=clang++" >> $GITHUB_ENV
          fi
          echo "CXXFLAGS=-fsanitize=fuzzer,address -g -O2 -gdwarf-5 -fuse-ld=lld -fno-omit-frame-pointer" >> $GITHUB_ENV
          echo "LDFLAGS=-fuse-ld=lld -gdwarf-5 -Wl,--threads=auto" >> $GITHUB_ENV
          echo "MAKEFLAGS=-j$(nproc 2>/dev/null || sysctl -n hw.ncpu)" >> $GITHUB_ENV
        
      - name: Build cryptofuzz with dfuzz
        run: |
          cd cryptofuzz
          python3 gen_repository.py
          
          # Build JavaScript modules with dfuzz in parallel
          for module in noble-curves noble-hashes bn.js elliptic; do
            (
              echo "Building $module..."
              cd modules/$module
              [ -f package.json ] && npm install
              make clean && make
            ) &
          done
          
          # Wait for all background jobs
          wait
          
          # Build main fuzzer
          make clean && make
          
      - name: Run smoke test
        run: |
          cd cryptofuzz
          timeout 10s ./cryptofuzz || true
          echo "✅ Fuzzer built successfully with dfuzz"
      
      - name: Upload fuzzer binary
        uses: actions/upload-artifact@v4
        with:
          name: cryptofuzz-${{ matrix.os }}
          path: cryptofuzz/cryptofuzz
          retention-days: 7
