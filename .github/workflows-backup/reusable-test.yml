name: Reusable Test Workflow

on:
  workflow_call:
    inputs:
      test-command:
        description: 'Test command to run'
        type: string
        required: true
      coverage:
        description: 'Enable coverage reporting'
        type: boolean
        default: false
      coverage-threshold:
        description: 'Minimum coverage threshold'
        type: number
        default: 80
      timeout-minutes:
        description: 'Test timeout in minutes'
        type: number
        default: 30
      artifact-name:
        description: 'Name for test artifacts'
        type: string
        default: 'test-results'
      matrix-strategy:
        description: 'Test matrix as JSON string'
        type: string
        default: '{}'
      parallel:
        description: 'Run tests in parallel'
        type: boolean
        default: true

jobs:
  test:
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.matrix-strategy) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup test environment
        uses: ./.github/workflows/reusable-setup.yml
        with:
          node-version: ${{ matrix.node-version || '20' }}
          python-version: ${{ matrix.python-version || '3.11' }}

      - name: Run tests
        id: test
        run: |
          echo "Running test command: ${{ inputs.test-command }}"
          if [ "${{ inputs.parallel }}" == "true" ]; then
            ${{ inputs.test-command }} --parallel || TEST_EXIT_CODE=$?
          else
            ${{ inputs.test-command }} || TEST_EXIT_CODE=$?
          fi
          echo "exit-code=${TEST_EXIT_CODE:-0}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Generate coverage report
        if: inputs.coverage
        run: |
          if [ -f "coverage/lcov.info" ]; then
            npx nyc report --reporter=text --reporter=lcov
          elif [ -f "coverage.xml" ]; then
            python -m coverage report
          fi

      - name: Check coverage threshold
        if: inputs.coverage && inputs.coverage-threshold > 0
        run: |
          COVERAGE=$(grep -oP '\d+(?=%)' coverage-report.txt | head -1)
          if [ "$COVERAGE" -lt "${{ inputs.coverage-threshold }}" ]; then
            echo "Coverage ${COVERAGE}% is below threshold ${{ inputs.coverage-threshold }}%"
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}-${{ matrix.os || 'ubuntu' }}-${{ github.run_id }}
          path: |
            test-results/
            coverage/
            *.log
          retention-days: 7

      - name: Report test status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const exitCode = ${{ steps.test.outputs.exit-code }};
            const status = exitCode === 0 ? '✅' : '❌';
            const message = `Test ${status} on ${{ matrix.os || 'ubuntu-latest' }} (Exit code: ${exitCode})`;
            
            if (context.eventName === 'pull_request') {
              github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.payload.pull_request.number,
                body: message
              });
            }

      - name: Fail job if tests failed
        if: steps.test.outputs.exit-code != '0'
        run: exit ${{ steps.test.outputs.exit-code }}