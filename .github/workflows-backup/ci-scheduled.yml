name: Scheduled Comprehensive Tests

on:
  schedule:
    - cron: '0 2 * * 1'  # Weekly Monday 2 AM
  workflow_dispatch:
    inputs:
      include-compliance:
        type: boolean
        default: true
        description: 'Run compliance tests'
      include-security:
        type: boolean
        default: true
        description: 'Run security scans'

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # Comprehensive testing suite
  comprehensive-test:
    name: Weekly Comprehensive Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0  # Need full history for some checks
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          
      - name: Install dependencies
        run: |
          npm ci
          pip install crypto-condor pytest safety bandit
          
      - name: Run extended fuzzing (1M iterations)
        run: |
          if [ -d cryptofuzz ]; then
            cd cryptofuzz
            make clean && make
            timeout 45m ./cryptofuzz -runs=1000000 || true
            cd ..
          fi
          
      - name: Run compliance tests
        if: inputs.include-compliance != false
        run: |
          python3 << 'EOF'
          import subprocess
          import json
          from datetime import datetime
          
          results = {
            'timestamp': datetime.now().isoformat(),
            'modules': {},
            'summary': {'total': 0, 'passed': 0}
          }
          
          modules = ['noble-curves', 'noble-hashes']
          for module in modules:
            try:
              # Run module tests
              subprocess.run(['npm', 'test'], cwd='curves', check=True, timeout=300)
              results['modules'][module] = 'passed'
              results['summary']['passed'] += 1
            except:
              results['modules'][module] = 'failed'
            results['summary']['total'] += 1
          
          with open('compliance-report.json', 'w') as f:
            json.dump(results, f, indent=2)
          
          print(f"Compliance: {results['summary']['passed']}/{results['summary']['total']} passed")
          EOF
          
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comprehensive-test-results
          path: |
            compliance-report.json
            cryptofuzz/crash-*
          retention-days: 30

  # Security and dependency scanning
  security-scan:
    name: Security & Dependency Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: inputs.include-security != false
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup tools
        run: |
          npm ci
          pip install safety bandit pip-audit
          
      - name: Run npm audit
        run: |
          npm audit --json > npm-audit.json || true
          
      - name: Run Python security scan
        run: |
          safety check --json > safety-report.json || true
          bandit -r . -f json > bandit-report.json || true
          pip-audit --format json > pip-audit.json || true
          
      - name: Check for outdated dependencies
        run: |
          npm outdated --json > npm-outdated.json || true
          pip list --outdated --format json > pip-outdated.json || true
          
      - name: Generate security summary
        run: |
          python3 << 'EOF'
          import json
          import glob
          
          vulnerabilities = []
          for report in glob.glob('*-report.json', '*-audit.json'):
            try:
              with open(report) as f:
                data = json.load(f)
                # Extract vulnerabilities (simplified)
                if 'vulnerabilities' in data:
                  vulnerabilities.extend(data['vulnerabilities'])
            except:
              pass
          
          summary = {
            'total_vulnerabilities': len(vulnerabilities),
            'critical': sum(1 for v in vulnerabilities if 'critical' in str(v).lower()),
            'high': sum(1 for v in vulnerabilities if 'high' in str(v).lower())
          }
          
          print(f"Security Summary: {summary['total_vulnerabilities']} vulnerabilities")
          print(f"  Critical: {summary['critical']}, High: {summary['high']}")
          
          with open('security-summary.json', 'w') as f:
            json.dump(summary, f, indent=2)
          EOF
          
      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            *-audit.json
            *-report.json
            security-summary.json
          retention-days: 30
          
      - name: Create issue for critical vulnerabilities
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const summary = JSON.parse(fs.readFileSync('security-summary.json', 'utf8'));
              if (summary.critical > 0) {
                github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: `Security Alert: ${summary.critical} critical vulnerabilities found`,
                  body: `Weekly security scan found ${summary.total_vulnerabilities} vulnerabilities:\n- Critical: ${summary.critical}\n- High: ${summary.high}\n\nCheck the workflow artifacts for details.`,
                  labels: ['security', 'critical']
                });
              }
            } catch (e) {
              console.log('No critical vulnerabilities found or error reading summary');
            }

  # Performance benchmarking
  benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: Run benchmarks
        run: |
          cat > benchmark.js << 'EOF'
          const crypto = require('crypto');
          const fs = require('fs');
          
          function benchmark(name, fn, iterations = 10000) {
            const start = process.hrtime.bigint();
            for (let i = 0; i < iterations; i++) fn();
            const elapsed = Number(process.hrtime.bigint() - start) / 1e6;
            return {
              name,
              iterations,
              totalMs: elapsed,
              opsPerSec: Math.round((iterations / elapsed) * 1000)
            };
          }
          
          const results = [];
          const data = crypto.randomBytes(1024);
          
          results.push(benchmark('SHA-256', () => {
            crypto.createHash('sha256').update(data).digest();
          }));
          
          results.push(benchmark('HMAC-SHA256', () => {
            crypto.createHmac('sha256', 'key').update(data).digest();
          }));
          
          console.table(results);
          fs.writeFileSync('benchmark-results.json', JSON.stringify(results, null, 2));
          EOF
          
          node benchmark.js
          
      - name: Compare with baseline
        run: |
          # Store or compare benchmark results
          echo "Benchmark completed. Results saved to benchmark-results.json"
          
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.json
          retention-days: 90

  # Summary job
  weekly-summary:
    name: Weekly Report
    needs: [comprehensive-test, security-scan, benchmark]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate weekly report
        run: |
          cat > weekly-report.md << 'EOF'
          # Weekly CI Report
          
          ## Test Results
          - Comprehensive Tests: ${{ needs.comprehensive-test.result }}
          - Security Scan: ${{ needs.security-scan.result }}
          - Performance Benchmark: ${{ needs.benchmark.result }}
          
          ## Actions
          - Review security reports in artifacts
          - Check for performance regressions
          - Update dependencies if needed
          
          Generated: $(date)
          EOF
          
          cat weekly-report.md >> $GITHUB_STEP_SUMMARY
          
      - name: Upload weekly report
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report
          path: weekly-report.md
          retention-days: 90